on:
  workflow_dispatch:

jobs:
  export_macos:
    runs-on: macos-latest
    permissions: write-all
    name: Export macOS
    env:
      SOURCE_PATH: ${{ github.workspace }}/DeltaruneChinesePatcher
      GODOT_SOURCE_PATH: ${{ github.workspace }}/godot
      GODOT_EDITOR_PATH: ${{ github.workspace }}/godot/bin/godot.macos.editor.arm64.mono
      LOCAL_NUGET_PATH: ${{ github.workspace }}/local-nuget
      DOTNET_DOWNLOAD_PATH: ${{ github.workspace }}/dotnet-download

    steps:
    - name: Checkout Project
      uses: actions/checkout@v7
      with:
        path: ${{ env.SOURCE_PATH }}

    - name: Setup .NET Download DIR & Change Xcode Version
      run: |
        mkdir ${{ env.DOTNET_DOWNLOAD_PATH }}
        sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer

    - name: Setup .NET 8
      working-directory: ${{ env.DOTNET_DOWNLOAD_PATH }}
      run: |
        wget https://dot.net/v1/dotnet-install.sh
        chmod +x dotnet-install.sh
        ./dotnet-install.sh
        echo "~/.dotnet" >> $GITHUB_PATH
        echo "DOTNET_ROOT=\"~/.dotnet\"" >> $GITHUB_ENV

    - name: Cache Godot Build Artifacts
      id: godot-cache
      uses: actions/cache@v5
      with:
        path: |
          ${{ env.GODOT_SOURCE_PATH }}/bin
          ${{ env.GODOT_SOURCE_PATH }}/modules/mono/glue
          ${{ env.LOCAL_NUGET_PATH }}
        key: godot-build-${{ runner.os }}-4.7-${{ steps.godot_commit.outputs.hash }}
        restore-keys: |
          godot-build-${{ runner.os }}-4.7-

    - name: Clone Godot Engine
      if: steps.godot-cache.outputs.cache-hit != 'true'
      uses: actions/checkout@v7
      with:
        repository: godotengine/godot
        path: ${{ env.GODOT_SOURCE_PATH }}
        ref: '4.7'
          
    - name: Install Godot Build Dependencies
      if: steps.godot-cache.outputs.cache-hit != 'true'
      run: |
        brew install scons
        chmod +x ${{ env.GODOT_SOURCE_PATH }}/misc/scripts/install_vulkan_sdk_macos.sh
        bash ${{ env.GODOT_SOURCE_PATH }}/misc/scripts/install_vulkan_sdk_macos.sh

    - name: Patch Godot Error Message
      if: steps.godot-cache.outputs.cache-hit != 'true'
      run: |
        python3 - <<'PY'
        from pathlib import Path

        def cpp_u32(s: str) -> str:
            out = []
            for ch in s:
                o = ord(ch)
                if ch == "\n":
                    out.append("\\n")
                elif ch == '"':
                    out.append('\\"')
                elif ch == "\\":
                    out.append("\\\\")
                elif 32 <= o < 127:
                    out.append(ch)
                elif o <= 0xFFFF:
                    out.append(f"\\u{o:04X}")
                else:
                    out.append(f"\\U{o:08X}")
            return "".join(out)

        msg = "请完全解压整个压缩包，而不是直接运行里面的程序，更不是单独把程序解压出来\n如果你确定已完全解压，但仍看到此窗口，请确认你没有私自修改 .pck 与程序本体的文件名，请确保本程序与 .pck 的文件名是相同的\n\n請完全提取整個壓縮檔，而不是直接執行裡面的程式，更不是單獨把程式提取出來\n如果你確定已完全提取，但仍看到此視窗，請確認你沒有私自修改 .pck 與程式本體的檔名，請確保本程式與 .pck 的檔名是相同的\n\nPlease fully extract the entire archive, rather than directly running the program inside, and certainly do not extract only the executable.\nIf you are sure that everything has been fully extracted but still see this window, please confirm that you didn't rename the .pck file or the program executable. Please ensure that both the program and the `.pck` file share the exact same filename.\n\n\n"

        main_cpp = Path("${{ env.GODOT_SOURCE_PATH }}") / "main" / "main.cpp"
        text = main_cpp.read_text(encoding="utf-8")
        old = 'String error_msg = "Error: Couldn\'t load project data at path'
        new = 'String error_msg = U"' + cpp_u32(msg + "Error: Couldn't load project data at path")
        if old not in text:
            raise RuntimeError(f"Target string not found in {main_cpp}")
        main_cpp.write_text(text.replace(old, new, 1), encoding="utf-8")
        PY

    - name: Build Godot
      if: steps.godot-cache.outputs.cache-hit != 'true'
      working-directory: ${{ env.GODOT_SOURCE_PATH }}
      run: |
        python "${{ env.GODOT_SOURCE_PATH }}/misc/scripts/install_angle.py"
        scons platform=macos arch=arm64 target=editor module_mono_enabled=yes production=yes debug_symbols=no optimize=size module_text_server_adv_enabled=no module_text_server_fb_enabled=yes module_godot_physics_2d_enabled=no module_godot_physics_3d_enabled=no module_jolt_enabled=no module_basis_universal_enabled=no module_bcdec_enabled=no module_bmp_enabled=no module_camera_enabled=no module_csg_enabled=no module_dds_enabled=no module_enet_enabled=no module_etcpak_enabled=no module_fbx_enabled=no module_gltf_enabled=no module_gridmap_enabled=no module_hdr_enabled=no module_interactive_music_enabled=no module_jsonrpc_enabled=no module_ktx_enabled=no module_mbedtls_enabled=no module_meshoptimizer_enabled=no module_minimp3_enabled=no module_mobile_vr_enabled=no module_msdfgen_enabled=no module_multiplayer_enabled=no module_noise_enabled=no module_navigation_2d_enabled=no module_navigation_3d_enabled=no module_ogg_enabled=no module_openxr_enabled=no module_raycast_enabled=no module_tga_enabled=no module_theora_enabled=no module_tinyexr_enabled=no module_upnp_enabled=no module_vhacd_enabled=no module_vorbis_enabled=no module_webrtc_enabled=no module_websocket_enabled=no module_webxr_enabled=no module_zip_enabled=no accesskit=no
        scons platform=macos target=template_release arch=arm64 module_mono_enabled=yes disable_3d=yes module_regex_enabled=no module_svg_enabled=no production=yes debug_symbols=no optimize=size module_text_server_adv_enabled=no module_text_server_fb_enabled=yes module_godot_physics_2d_enabled=no module_godot_physics_3d_enabled=no module_jolt_enabled=no disable_physics_2d=yes disable_physics_3d=yes module_basis_universal_enabled=no module_bcdec_enabled=no module_bmp_enabled=no module_camera_enabled=no module_csg_enabled=no module_dds_enabled=no module_enet_enabled=no module_etcpak_enabled=no module_fbx_enabled=no module_gltf_enabled=no module_gridmap_enabled=no module_hdr_enabled=no module_interactive_music_enabled=no module_jsonrpc_enabled=no module_ktx_enabled=no module_mbedtls_enabled=no module_meshoptimizer_enabled=no module_minimp3_enabled=no module_mobile_vr_enabled=no module_msdfgen_enabled=no module_multiplayer_enabled=no module_noise_enabled=no module_navigation_2d_enabled=no module_navigation_3d_enabled=no module_ogg_enabled=no module_openxr_enabled=no module_raycast_enabled=no module_tga_enabled=no module_theora_enabled=no module_tinyexr_enabled=no module_upnp_enabled=no module_vhacd_enabled=no module_vorbis_enabled=no module_webrtc_enabled=no module_websocket_enabled=no module_webxr_enabled=no module_zip_enabled=no accesskit=no
        scons platform=macos target=template_release arch=x86_64 generate_bundle=yes module_mono_enabled=yes disable_3d=yes module_regex_enabled=no module_svg_enabled=no production=yes debug_symbols=no optimize=size module_text_server_adv_enabled=no module_text_server_fb_enabled=yes module_godot_physics_2d_enabled=no module_godot_physics_3d_enabled=no module_jolt_enabled=no disable_physics_2d=yes disable_physics_3d=yes module_basis_universal_enabled=no module_bcdec_enabled=no module_bmp_enabled=no module_camera_enabled=no module_csg_enabled=no module_dds_enabled=no module_enet_enabled=no module_etcpak_enabled=no module_fbx_enabled=no module_gltf_enabled=no module_gridmap_enabled=no module_hdr_enabled=no module_interactive_music_enabled=no module_jsonrpc_enabled=no module_ktx_enabled=no module_mbedtls_enabled=no module_meshoptimizer_enabled=no module_minimp3_enabled=no module_mobile_vr_enabled=no module_msdfgen_enabled=no module_multiplayer_enabled=no module_noise_enabled=no module_navigation_2d_enabled=no module_navigation_3d_enabled=no module_ogg_enabled=no module_openxr_enabled=no module_raycast_enabled=no module_tga_enabled=no module_theora_enabled=no module_tinyexr_enabled=no module_upnp_enabled=no module_vhacd_enabled=no module_vorbis_enabled=no module_webrtc_enabled=no module_websocket_enabled=no module_webxr_enabled=no module_zip_enabled=no accesskit=no

    - name: Generate Mono Glue & Build Assemblies
      if: steps.godot-cache.outputs.cache-hit != 'true'
      working-directory: ${{ env.GODOT_SOURCE_PATH }}
      run: |
        mkdir -p ${{ env.LOCAL_NUGET_PATH }}
        ${{ env.GODOT_EDITOR_PATH }} --headless --generate-mono-glue modules/mono/glue
        python3 ./modules/mono/build_scripts/build_assemblies.py --godot-output-dir=./bin --push-nupkgs-local ${{ env.LOCAL_NUGET_PATH }}
        
    - name: Configure Local NuGet Source
      run: |
        mkdir -p ${{ env.LOCAL_NUGET_PATH }}
        cat > nuget.config << EOL
        <?xml version="1.0" encoding="utf-8"?>
        <configuration>
          <packageSources>
            <clear />
            <add key="local-godot" value="${{ env.LOCAL_NUGET_PATH }}" />
            <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
          </packageSources>
          <packageSourceMapping>
            <packageSource key="local-godot">
              <package pattern="Godot.NET.Sdk" />
              <package pattern="Godot.SourceGenerators" />
              <package pattern="GodotSharp" />
              <package pattern="GodotSharpEditor" />
            </packageSource>
            <packageSource key="nuget.org">
              <package pattern="*" />
            </packageSource>
          </packageSourceMapping>
        </configuration>
        EOL

    - name: .NET Restore
      run: dotnet restore
      working-directory: ${{ env.SOURCE_PATH }}

    - name: Build Solution
      run: dotnet build
      working-directory: ${{ env.SOURCE_PATH }}
      
    - name: Install Custom Export Template
      run: |
        TEMPLATE_DIR="/Users/runner/Library/Application Support/Godot/export_templates/4.7.3.rc.mono"
        mkdir -p "$TEMPLATE_DIR"
        cp ${{ env.GODOT_SOURCE_PATH }}/bin/godot_macos_mono.zip "${TEMPLATE_DIR}/macos.zip"

    - name: Export Project
      run: |
        mkdir -p ${{ github.workspace }}/build/DeltaruneChinesePatcher_macOS
        ${{ env.GODOT_EDITOR_PATH }} --headless --path ${{ env.SOURCE_PATH }} --export-release "macOS" "${{ github.workspace }}/build/DeltaruneChinesePatcher_macOS/DELTARUNE Chinese Patcher.app"
    
    - name: Process files
      run: |
          rm -rf "${{ github.workspace }}/build/DeltaruneChinesePatcher_macOS/DELTARUNE Chinese Patcher.app/Contents/Resources/data_DeltaruneChinesePatcher_macos_arm64/DeltaruneChinesePatcher.dylib.dsym"
          rm -rf "${{ github.workspace }}/build/DeltaruneChinesePatcher_macOS/DELTARUNE Chinese Patcher.app/Contents/Resources/data_DeltaruneChinesePatcher_macos_x86_64/DeltaruneChinesePatcher.dylib.dsym"
          mkdir -p "${{ github.workspace }}/build/DeltaruneChinesePatcher_macOS/DELTARUNE Chinese Patcher.app/Contents/MacOS/externals/7zip"
          mkdir -p "${{ github.workspace }}/build/DeltaruneChinesePatcher_macOS/DELTARUNE Chinese Patcher.app/Contents/MacOS/externals/xdelta3"
          cp "${{ env.SOURCE_PATH }}/externals/7zip/7z_mac" "${{ github.workspace }}/build/DeltaruneChinesePatcher_macOS/DELTARUNE Chinese Patcher.app/Contents/MacOS/externals/7zip/"
          cp "${{ env.SOURCE_PATH }}/externals/xdelta3/xdelta3_mac" "${{ github.workspace }}/build/DeltaruneChinesePatcher_macOS/DELTARUNE Chinese Patcher.app/Contents/MacOS/externals/xdelta3/"
          cp "${{ env.SOURCE_PATH }}/.macOS 导出附带文件/遇到问题读我.txt" "${{ github.workspace }}/build/DeltaruneChinesePatcher_macOS/"
    
    - name: Codesign
      run: |
          sudo xattr -cr "${{ github.workspace }}/build/DeltaruneChinesePatcher_macOS/DELTARUNE Chinese Patcher.app"
          codesign -s - --force "${{ github.workspace }}/build/DeltaruneChinesePatcher_macOS/DELTARUNE Chinese Patcher.app/Contents/MacOS/externals/7zip/7z_mac"
          codesign -s - --force "${{ github.workspace }}/build/DeltaruneChinesePatcher_macOS/DELTARUNE Chinese Patcher.app/Contents/MacOS/externals/xdelta3/xdelta3_mac"
          codesign -s - --force "${{ github.workspace }}/build/DeltaruneChinesePatcher_macOS/DELTARUNE Chinese Patcher.app/Contents/MacOS/DELTARUNE Chinese Patcher"

    - name: Archive
      run: |
        cd ${{ github.workspace }}/build/DeltaruneChinesePatcher_macOS
        zip -r ../DeltaruneChinesePatcher_macOS.zip .

    - name: Create DMG
      run: |
        brew install create-dmg
        create-dmg \
          --volname "DELTARUNE Chinese Patcher" \
          --background "${{ env.SOURCE_PATH }}/arrow.png" \
          --window-pos 200 120 \
          --window-size 600 300 \
          --icon-size 80 \
          --icon "DELTARUNE Chinese Patcher.app" 180 130 \
          --hide-extension "DELTARUNE Chinese Patcher.app" \
          --app-drop-link 450 130 \
          "${{ github.workspace }}/build/DeltaruneChinesePatcher_macOS.dmg" \
          "${{ github.workspace }}/build/DeltaruneChinesePatcher_macOS/DELTARUNE Chinese Patcher.app/"
        
    - name: Upload Artifact (DMG)
      uses: actions/upload-artifact@v7
      with:
        name: macOS (DMG)
        path: ${{ github.workspace }}/build/DeltaruneChinesePatcher_macOS.dmg
        
    - name: Upload Artifact (ZIP)
      uses: actions/upload-artifact@v7
      with:
        name: macOS (ZIP)
        path: ${{ github.workspace }}/build/DeltaruneChinesePatcher_macOS.zip
